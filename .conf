# Fragmento de kernel config para Xeon X5460 (socket 771/775, FSB1333)
# Uso: scripts/kconfig/merge_config.sh -m arch/x86/configs/x86_64_defconfig x5460-server.config
# luego: make olddefconfig && make -j$(nproc)

# --- CPU / SMP ---
CONFIG_MCORE2=y
CONFIG_SMP=y
CONFIG_NR_CPUS=16
CONFIG_SCHED_SMP=y
CONFIG_X86_MCE=y
CONFIG_MICROCODE=y
CONFIG_MICROCODE_INTEL=y
CONFIG_X86_MSR=y
CONFIG_X86_CPUID=y
CONFIG_NUMA=y
CONFIG_ACPI=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_CPU_FREQ=y
CONFIG_X86_ACPI_CPUFREQ=y

# --- PCI / chipset ---
CONFIG_PCI=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCI_MSI=y
CONFIG_PCI_QUIRKS=y
CONFIG_HPET_TIMER=y
CONFIG_IOMMU_SUPPORT=y
CONFIG_INTEL_IOMMU=y

# --- SATA / almacenamiento ---
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_PIIX=y
CONFIG_ATA_GENERIC=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_SR=y

# --- USB ---
CONFIG_USB=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_XHCI_HCD=m
CONFIG_USB_STORAGE=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y

# --- Red (Intel 82571/82574, común en estas placas) ---
CONFIG_NET=y
CONFIG_ETHERNET=y
CONFIG_NET_VENDOR_INTEL=y
CONFIG_E1000=y
CONFIG_E1000E=y

# --- Video: ambas rutas activas como módulos para que coexistan sin conflicto ---
CONFIG_DRM=y
CONFIG_FB=y
CONFIG_VT=y
CONFIG_VGA_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_DUMMY_CONSOLE=y

# Ruta A: ATI Rage XL / ES1000 integrada (típica en placas de servidor)
CONFIG_FB_ATY=m

# Ruta B: Radeon PCI discreta (pre-PCIe, R100 en adelante)
CONFIG_DRM_RADEON=m

# --- GNU toolchain / userspace de referencia (no son opciones de Kconfig, son notas) ---
# gcc 12.x o 13.x, flags: -march=core2 -mtune=core2
# glibc 2.35 - 2.39
# binutils 2.38+
# Mesa: si usas Ruta B, el driver clásico es r100/r200 (Gallium classic).
#       Nunca uses amdgpu ni radeonsi con este hardware (son solo para GPUs GCN+).
#       Si usas Ruta A (ES1000), no hay 3D real; X11 funcionará con xf86-video-vesa
#       o xf86-video-ati en modo legacy, sin necesitar Mesa acelerado.